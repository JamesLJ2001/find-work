<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>郎朗秋招招聘看板</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 24px; line-height: 1.6; }
    h1 { margin-bottom: 4px; }
    .hint { color: #666; margin-bottom: 20px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 8px; vertical-align: top; }
    th { background: #f5f5f5; text-align: left; }
    .high { font-weight: 700; }
    .today { background: #fff8dc; }
    .soon { background: #f6ffed; }
    .muted { color: #777; }
  </style>
</head>
<body>
  <h1>郎朗 2027 届秋招招聘看板</h1>
  <div class="hint">数据来自 <code>data/recruitment_events.csv</code>，运行 <code>python scripts/make_calendar.py</code> 后更新。</div>
  <p><a href="./recruitment.ics">下载/订阅日历文件 recruitment.ics</a></p>
  <table>
    <thead>
      <tr>
        <th>日期</th>
        <th>公司</th>
        <th>事件</th>
        <th>阶段</th>
        <th>优先级</th>
        <th>链接</th>
        <th>备注</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    function daysBetween(dateStr) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const d = new Date(dateStr + 'T00:00:00');
      return Math.round((d - today) / (24 * 3600 * 1000));
    }

    fetch('./events.json')
      .then(res => res.json())
      .then(events => {
        events.sort((a, b) => a.date.localeCompare(b.date));
        const tbody = document.getElementById('rows');
        tbody.innerHTML = events.map(e => {
          const diff = daysBetween(e.date);
          const cls = diff === 0 ? 'today' : (diff > 0 && diff <= 7 ? 'soon' : '');
          const link = e.url ? `<a href="${e.url}" target="_blank">打开</a>` : '<span class="muted">待补充</span>';
          return `<tr class="${cls}">
            <td>${e.date}</td>
            <td>${e.company}</td>
            <td>${e.event}</td>
            <td>${e.stage || ''}</td>
            <td class="${e.priority === 'high' ? 'high' : ''}">${e.priority || ''}</td>
            <td>${link}</td>
            <td>${e.notes || ''}</td>
          </tr>`;
        }).join('');
      })
      .catch(err => {
        document.getElementById('rows').innerHTML = `<tr><td colspan="7">读取 events.json 失败：${err}</td></tr>`;
      });
  </script>
</body>
</html>
